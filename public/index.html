<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Codex Remote</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="shell">
  <header><div class="brand"><span class="mark">✦</span><div><strong>CODEX REMOTE</strong><small>远程工作台</small></div></div><div class="header-actions"><a class="view-link" href="/thinking.html">过程 <span>↗</span></a><div class="status"><i id="dot"></i><span id="statusText">未连接</span></div><button id="menuBtn" title="对话与连接设置" aria-label="对话与连接设置">☰</button></div></header>
  <main><aside><div class="side-head"><span>对话</span><button id="newBtn" title="新建对话">＋</button></div><div id="threads" class="threads"></div><div class="side-foot"><label>电脑端目录</label><input id="cwd" placeholder="D:\\project"><label>访问口令</label><input id="token" type="password" placeholder="CODEX_REMOTE_TOKEN"><button id="connectBtn" class="connect">连接电脑</button></div></aside>
  <section class="workspace"><div class="crumb"><span id="threadName">选择或新建对话</span><span class="pill" id="model">Codex</span></div><div id="feed" class="feed"><div class="empty"><div class="empty-icon">⌁</div><h1>远程操控 Codex</h1><p>在电脑端启动桥接服务，然后从手机发送任务。</p><p class="hint">连接后，任务输出会实时出现在这里。</p></div></div><div class="composer"><textarea id="prompt" rows="2" placeholder="描述你要 Codex 完成的任务…"></textarea><div class="compose-row"><span class="compose-hint">Enter 发送 · Shift+Enter 换行</span><button id="sendBtn" class="send" title="发送任务">发送 <span>↗</span></button></div></div></section></main>
</div><script src="/app.js"></script></body></html>
