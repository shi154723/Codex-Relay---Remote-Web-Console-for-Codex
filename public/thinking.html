<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Codex 过程</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="process-shell"><header><div class="brand"><span class="mark">✦</span><div><strong>CODEX REMOTE</strong><small>过程观察</small></div></div><div class="header-actions"><a class="view-link" href="/">对话 <span>↗</span></a><div class="status"><i></i><span id="statusText">未连接</span></div></div></header>
<main class="process-main"><div class="process-nav"><div class="process-title"><h1>过程</h1><p>查看 Codex 对外提供的推理摘要、计划、命令输出和状态变化</p></div><a class="back-link" href="/">← 返回对话</a></div>
